name: Cinema Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. VERIFY BACKEND (SPRING BOOT 4 / JAVA 21)
  # ==========================================
  backend-check:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  # ==========================================
  # 2. VERIFY DOCKER BUILD
  # ==========================================
  docker-check:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: [ backend-check ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
