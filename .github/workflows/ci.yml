name: Cinema Fullstack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. VERIFY BACKEND (SPRING BOOT 4 / JAVA 21)
  # ==========================================
  backend-check:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend with Maven
        run: |
          cd CinemaApplication
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  # ==========================================
  # 2. VERIFY FRONTEND (REACT 19 / TYPESCRIPT)
  # ==========================================
  frontend-check:
    name: Verify Frontend TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Typecheck
        run: |
          cd frontend
          npm ci
          npm run typecheck

  # ==========================================
  # 3. VERIFY DOCKER BUILDS
  # ==========================================
  docker-check:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: [ backend-check, frontend-check ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./CinemaApplication
          file: ./CinemaApplication/Dockerfile
          push: false

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
